<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Engineering Design Patterns — Reader</title>
  <meta name="description" content="A styled reader for Data Engineering Design Patterns by Bartosz Konieczny — 68 design patterns across 10 chapters." />
  <link rel="stylesheet" href="assets/vendor/github-dark.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a3a5c'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23f5f2ea' text-anchor='middle' font-weight='bold'%3EDP%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">DE</div>
        <div class="brand-text">
          <span class="brand-title">Design Patterns</span>
          <span class="brand-sub">Bartosz Konieczny</span>
        </div>
      </div>

      <div class="search-wrap">
        <input type="search" id="search" placeholder="Filter documents…" autocomplete="off" spellcheck="false" />
      </div>

      <nav class="nav" id="nav" aria-label="Documents"></nav>

      <div class="sidebar-foot">
        <span>68 patterns · 10 chapters</span>
        <a href="https://github.com/wutienyang/markdown-viewer" target="_blank" rel="noopener">Source</a>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
        </div>
      </header>

      <div class="content-area">
        <article class="doc" id="doc">
          <div class="loading">Loading…</div>
        </article>

        <aside class="toc" id="toc" aria-label="On this page">
          <div class="toc-title">On this page</div>
          <nav id="tocNav"></nav>
        </aside>
      </div>

      <footer class="doc-foot" id="docFoot"></footer>
    </main>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
